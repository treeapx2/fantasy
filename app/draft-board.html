<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.45;
  -webkit-text-size-adjust:100%;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;gap:8px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:0 0 auto}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;margin:0}
.hint{color:var(--ink-3);font-size:11px}
.addbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.add{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:5px;
  padding:4px 9px;font:700 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.05em;cursor:pointer}
.add:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.add:disabled{opacity:.35;cursor:not-allowed}
.add.close{border-color:var(--line);font-size:13px;padding:3px 7px}
.tierkey{display:flex;gap:2px;align-items:center;margin-left:auto}
.tierkey i{width:15px;height:8px;border-radius:2px;display:block}
.tierkey span{font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.quads{flex:1 1 auto;display:grid;gap:8px;min-height:0;
  grid-template-columns:1fr;grid-template-rows:repeat(var(--n,1),minmax(0,1fr))}
@media(min-width:1000px){
  .quads[data-n="1"]{grid-template-columns:1fr;grid-template-rows:1fr}
  .quads[data-n="2"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  /* three panes: the first runs the full height, the others take the right column */
  .quads[data-n="3"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .quads[data-n="3"] > .quad:first-child{grid-row:1 / span 2}
  .quads[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
}
.quad{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.qbar{display:flex;gap:4px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line);
  flex:0 0 auto;flex-wrap:wrap}
.qbar input{flex:1 1 70px;min-width:60px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);
  background:var(--ground);color:var(--ink);font:500 11px/1.2 "IBM Plex Sans",sans-serif}
.qbar input:focus,.qbar select:focus{outline:2px solid var(--accent);outline-offset:1px}
.qbar select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--ground);
  color:var(--ink-2);border-radius:5px;padding:4px 15px 4px 6px;font:600 10px/1.2 "IBM Plex Sans",sans-serif;
  cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 9px) 50%,calc(100% - 5px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
/* ---------- list ---------- */
.rows{list-style:none;margin:0;padding:0}
.r{display:grid;grid-template-columns:30px 1fr 40px 26px 26px 34px 62px 60px;gap:5px;align-items:center;
  padding:4px 6px;border-bottom:1px solid var(--line);border-left:5px solid var(--tier);cursor:pointer}
.r:hover{background:var(--panel-2)}
.r:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.udk{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.who{min-width:0}
.nm{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow:hidden;margin-top:1px}
.pos{font:600 8.5px/1 "IBM Plex Mono",monospace;padding:2px 3px;border-radius:3px;color:#fff}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}
.tch{font:600 8.5px/1 "IBM Plex Mono",monospace;padding:2px 3px;border-radius:3px;background:var(--tier);color:#fff}
.oth{font:500 9px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.fl{font:600 8px/1 "IBM Plex Sans",sans-serif;padding:2px 3px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em}
.fl.g{background:var(--good-bg);color:var(--good)}.fl.b{background:var(--bad-bg);color:var(--bad)}
.fl.m{background:var(--mid-bg);color:var(--mid)}
.meter{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.meter u{display:block;height:3px;border-radius:2px;background:var(--panel-2);margin-top:2px;text-decoration:none;overflow:hidden}
.meter u i{display:block;height:100%;background:currentColor}
.ru{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-align:center;
  border-radius:4px;padding:3px 0;font-variant-numeric:tabular-nums}
.pill{font:700 8.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 5px;border-radius:3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.pill.f{background:var(--panel-2);color:var(--ink-3)}
.tsep{display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--panel-2);
  border-bottom:1px solid var(--line);border-left:5px solid var(--tier)}
.tsep b{font:700 9px/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--tier)}
.tsep span{flex:1;height:1px;background:var(--line-2)}
.tsep em{font-style:normal;font:500 9px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.none{padding:22px 10px;text-align:center;color:var(--ink-3);font-size:11.5px}
/* ---------- profile ---------- */
.pf{padding:7px 8px;display:flex;flex-direction:column;gap:6px;height:100%;min-height:0}
.pfh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.pfh .nm2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1}
.back{margin-left:auto;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);
  border-radius:5px;padding:4px 9px;font:700 11px/1 "IBM Plex Sans",sans-serif;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex:0 0 auto}
.back:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.back span{font-size:13px;line-height:1}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:4px;flex:0 0 auto}
.m1{background:var(--panel-2);border-radius:5px;padding:3px 5px;text-align:center;min-width:0}
.m1 b{display:block;font:600 7.5px/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1 i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.m1 u{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:2px;
  overflow:hidden;text-decoration:none}
.m1 u i{display:block;height:100%}
.m1.sep{box-shadow:inset 2px 0 0 var(--line-2)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:4px;flex:0 0 auto}
.sc{background:var(--panel-2);border-radius:5px;padding:4px 6px;border:1px solid transparent;min-width:0}
.sc b{display:block;font:600 8px/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.sc.g{background:var(--good-bg);border-color:var(--good)}.sc.g i{color:var(--good)}
.sc.b{background:var(--bad-bg);border-color:var(--bad)}.sc.b i{color:var(--bad)}
.labs{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto}
.labs .fl{font-size:9.5px;padding:3px 7px;border:1px solid currentColor}
.rowlbl{font:600 7.5px/1.3 "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:2px 0 -1px}
.cases{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}
.cs{display:grid;grid-template-columns:15px 1fr;gap:5px;align-items:start}
.cs .ar{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;line-height:1.35;letter-spacing:-.08em}
.cs .ar.u{color:var(--good)}.cs .ar.d{color:var(--bad)}
.cs p{margin:0;font-size:11px;line-height:1.35}
.cs p s{text-decoration:none;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:8.5px}
.injp{background:var(--bad-bg);border-radius:5px;padding:4px 6px;font-size:10.5px;color:var(--bad);flex:0 0 auto}
.injp b{font-weight:600}
/* No native title tooltips anywhere — the browser's own tooltip forces a help cursor
   and cannot be styled or positioned. A single floating element does the job instead,
   so cursors stay honest: pointer on what you can click, default on what you cannot. */
#tip{position:fixed;z-index:99;max-width:270px;padding:6px 8px;border-radius:6px;
  background:var(--ink);color:var(--ground);font:500 11px/1.4 "IBM Plex Sans",sans-serif;
  box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(2px);
  transition:opacity .1s ease,transform .1s ease}
#tip.on{opacity:1;transform:translateY(0)}
[data-tip]{cursor:default}
.r [data-tip]{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const P = window.__BOARD__.players;
const KEY = "ffdb.quads.v2";
const FLEX = ["RB","WR","TE"];
const TAGCLS = { "strong value":"g", "undervalued":"g", "overvalued":"b", "strong fade":"b" };
const LBL = { my_guy:"My Guy", value:"Value", sleeper:"Sleeper", breakout:"Breakout", bust:"Bust", injury_concern:"Injury" };
const LBLCLS = { my_guy:"g", value:"g", sleeper:"g", breakout:"g", bust:"b", injury_concern:"b" };
const TREND_CAP = { QB:24, TE:24, RB:48, WR:48 };

const pane = (pos) => ({pos, sort:"rank", tag:"ALL", label:"ALL", q:"", open:null});
let Q = [pane("ALL")];
try { const r = localStorage.getItem(KEY); if (r) { const p = JSON.parse(r);
  if (Array.isArray(p) && p.length >= 1 && p.length <= 4) Q = p; } } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(Q)); } catch(e){} };

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n_ = v => (v === null || v === undefined) ? "—" : v;
const tierVar = t => `var(--t${Math.min(Math.max(t||11,1),11)})`;
// green at 0 risk / 10 upside through amber to red — one scale, read the same way everywhere
const heat = (v, invert) => {
  if (v === null || v === undefined) return "var(--flat)";
  const x = invert ? 10 - v : v;
  return x >= 6.5 ? "var(--good)" : x >= 3.5 ? "var(--mid)" : "var(--bad)";
};
const startCol = v => v === null || v === undefined ? "var(--flat)"
  : v >= 55 ? "var(--good)" : v >= 32 ? "var(--mid)" : "var(--bad)";

function trendSvg(p, w, h){
  const s = p.sr || [];
  if (s.length < 3 || s[s.length-1][0] < 2024) return `<span class="oth">—</span>`;
  const pts = s.slice(-6), cap = TREND_CAP[p.p] || 48;
  const x = i => (i/(pts.length-1))*(w-2)+1;
  const y = v => h-1-((cap-Math.min(v,cap))/(cap-1))*(h-2);
  const d = pts.map((pt,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(pt[1]).toFixed(1)}`).join("");
  const c = p.tj === null ? "var(--flat)" : p.tj < -1 ? "var(--good)" : p.tj > 1 ? "var(--bad)" : "var(--flat)";
  const dir = p.tj === null ? "flat" : p.tj < -1 ? "improving" : p.tj > 1 ? "declining" : "steady";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="finish rank ${dir}" data-tip="Positional finish, last ${pts.length} played seasons — ${dir}. Higher is better."
    ><path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1][1]).toFixed(1)}" r="1.9" fill="${c}"/></svg>`;
}

const SORTS = {
  rank:(a,b)=>a.br-b.br,
  udk:(a,b)=>(a.udk??9e3)-(b.udk??9e3), espn:(a,b)=>(a.espn??9e3)-(b.espn??9e3),
  adp:(a,b)=>(a.adp??9e3)-(b.adp??9e3), claude:(a,b)=>a.cr-b.cr,
  tier:(a,b)=>(a.tier??99)-(b.tier??99)||a.br-b.br,
  start:(a,b)=>(b.sp??-1)-(a.sp??-1),
  upside:(a,b)=>(b.au??-1)-(a.au??-1), risk:(a,b)=>(a.ar??99)-(b.ar??99),
  disagree:(a,b)=>Math.abs(b.cdl??0)-Math.abs(a.cdl??0),
};

function filtered(s){
  const q = s.q.trim().toLowerCase();
  return P.filter(p => {
    if (s.pos === "FLEX") { if (!FLEX.includes(p.p)) return false; }
    else if (s.pos !== "ALL" && p.p !== s.pos) return false;
    if (s.tag !== "ALL" && p.tag !== s.tag) return false;
    if (s.label !== "ALL" && !p.tags.includes(s.label)) return false;
    if (q && !(p.n.toLowerCase().includes(q) || p.tm.toLowerCase().includes(q))) return false;
    return true;
  }).slice().sort(SORTS[s.sort] || SORTS.rank);
}

function rowHtml(p){
  const flags = [

             .map(t => `<span class="fl ${LBLCLS[t]||"m"}" data-tip="On UDK's ${LBL[t]} expert list">${LBL[t]}</span>`),
  ].join("");
  const oth = `<span class="oth" data-tip="UDK / ESPN / ADP / Claude overall ranks">U${n_(p.udk)} E${n_(p.espn)} A${n_(p.adp)} C${p.cr}</span>`;
  const tdir = {good:"g", bad:"b", flat:"f"}[p.tdir] || "f";

      data-tip="Adjusted risk, 0–10 within position. Blends bust rate, injury status, volatility, sample size and UDK's risk score.">${n_(p.ar)}</span>
    <span class="ru" style="color:${heat(p.au)};background:${p.au===null?"transparent":"color-mix(in srgb,"+heat(p.au)+" 14%,transparent)"}"
      data-tip="Adjusted upside, 0–10 within position. Blends ceiling rate, trajectory, opportunity share and UDK's upside score.">${n_(p.au)}</span>
    <span class="meter">${trendSvg(p, 32, 15)}</span>
    <span class="pill ${TAGCLS[p.tag]||"f"}" data-tip="${esc(p.why||"")}">${esc(p.tag||"—")}</span>
    <span class="pill ${tdir}" data-tip="Positional finish across played seasons. ${p.tj===null?"Fewer than three seasons, so no slope.":"Slope "+p.tj+" places per year; negative is improving."}">${esc(p.trend||"—")}</span>
  </li>`;
}

function listHtml(s){
  const rows = filtered(s);
  if (!rows.length) return `<p class="none">No one matches.</p>`;
  const single = s.pos !== "ALL" && s.pos !== "FLEX";
  let out = "", last = null;
  for (const p of rows){
    if (single && p.tier !== last){
      const cnt = rows.filter(x => x.tier === p.tier).length;
      out += `<li class="tsep" style="--tier:${tierVar(p.tier)}"><b>Tier ${p.tier??"?"}</b><span></span><em>${cnt}</em></li>`;
      last = p.tier;
    }
    out += rowHtml(p);
  }
  return `<ul class="rows">${out}</ul>`;
}

function profileHtml(p){
  // One strip: published ranks, then my ratings, then the raw potentials — same cell
  // shape throughout so the eye reads across them without re-learning the layout.
  const m = (l,v,t,col,pct,sep) => `<span class="m1${sep?" sep":""}" data-tip="${t}"><b>${l}</b>
    <i${col?` style="color:${col}"`:""}>${v===null||v===undefined?"—":v}</i>${
      pct===undefined?"":`<u><i style="width:${pct===null?0:Math.min(100,pct)}%;background:${col}"></i></u>`}</span>`;

  // Colour here is earned: `sig` only carries a stat when it sits at least a standard
  // deviation from the positional mean, i.e. when it is actually moving the rating.
  const sc = (key,l,v,t) => v === null || v === undefined ? "" :
    `<span class="sc ${p.sig[key]||""}" data-tip="${t}"><b>${l}</b><i>${v}</i></span>`;
  const cs = n => `<div class="cs"><span class="ar ${n.d}">${n.d === "u" ? "↑".repeat(n.s) : "↓".repeat(n.s)}</span>
    <p>${esc(n.t)} <s>${esc(n.g)}</s></p></div>`;
  const notes = [...p.up.map(x=>({...x,d:"u"})), ...p.rk.map(x=>({...x,d:"d"}))];
  return `<div class="pf">
    <div class="pfh"><span class="nm2">${esc(p.n)}</span>
      <span class="pos ${p.p}">${p.p}${p.bpr}</span>
      <span class="tch" style="--tier:${tierVar(p.tier)};background:${tierVar(p.tier)}">T${p.tier??"?"}</span>
      <span class="oth">${esc(p.tm||"FA")}</span>
      <span class="fl ${TAGCLS[p.tag]||"m"}" data-tip="${esc(p.why||"")}">${esc(p.tag||"—")}</span>
      <button class="back" data-back="1" data-tip="Close this profile (Esc)"><span>&times;</span>Close</button></div>
    <p class="rowlbl">Ranks</p>
    <div class="mstrip">
      ${m("Rank",p.br,"Board rank — UDK 50%, ESPN 25%, Claude 25%. Blended score "+(p.bs??"—")+".")}
      ${m("UDK",p.udk,"UDK overall rank — the priority board, live as of the 9/5 scan")}
      ${m("ESPN",p.espn,"ESPN overall rank")}
      ${m("ADP",p.adp,"Market ADP rank")}
      ${m("Claude",p.cr,"Claude overall rank: value over positional replacement, adjusted for production, reliability, upside and market. "+(p.why||""))}
    </div>
    <p class="rowlbl">Risk and upside</p>
    <div class="mstrip">
      ${m("Risk",p.ar,"Adjusted risk 0–10 within position: bust rate, injury status, availability, volatility, sample size, UDK's risk score.",heat(p.ar,true),p.ar===null?null:p.ar*10)}
      ${m("Upside",p.au,"Adjusted upside 0–10 within position: ceiling rate, trajectory, opportunity share, UDK's upside score.",heat(p.au),p.au===null?null:p.au*10)}
      ${m("Trend",p.trend,p.tj===null?"Fewer than three played seasons, so no slope is drawn.":"Positional finish moving "+p.tj+" places a year; negative is improving.",{good:"var(--good)",bad:"var(--bad)"}[p.tdir]||"var(--flat)")}
      ${m("Start %",p.sp===null?null:p.sp+"%","How often he finishes a week as a startable "+p.p+" — the adjusted "+p.lb[0]+" rate.",startCol(p.sp),p.sp)}
      ${m("Avail",p.av===null||p.av===undefined?null:p.av+"%","Share of the games he was eligible for that he actually played, over a "+(p.ge/17)+"-season window. Feeds risk.",heat(p.av===null?null:p.av/10),p.av)}
      ${p.fl===null?"":m("Floor",p.fa===null?null:p.fa+"%","Adjusted "+p.lb[0]+" rate. UDK has him at "+p.fl+"%; his "+p.gp+" games carry "+p.sw+"% of the weight, the "+p.p+" average the rest.",startCol(p.fa),p.fa)}
      ${p.ce===null?"":m("Ceiling",p.ca===null?null:p.ca+"%","Adjusted "+p.lb[1]+" rate. UDK has him at "+p.ce+"%.",heat(p.ca===null?null:p.ca/6),p.ca)}
      ${p.bu===null?"":m("Bust",p.ba===null?null:p.ba+"%","Adjusted "+p.lb[2]+" rate. UDK has him at "+p.bu+"%. Lower is better.",heat(p.ba===null?null:10-p.ba/7),p.ba)}
    </div>
    <p class="rowlbl">Everything else</p>
    <div class="sgrid">
      ${sc("_","UDK proj",p.proj,"UDK projected points")}
      ${sc("clay","Clay proj",p.clay,"Mike Clay projected points. Coloured when the two projections disagree by 12% or more.")}
      ${sc("_","Depth",p.dep,"ESPN fantasy depth slot")}
      ${sc("os","Opp share",p.os===null?null:p.os+"%","Share of team opportunity. Coloured when a standard deviation or more from the "+p.p+" average.")}
      ${sc("rz","Inside 10",p.rz,"Scoring touches inside the 10. Coloured when a standard deviation or more from the "+p.p+" average.")}
      ${sc("td","TD dep",p.td===null?null:(p.td>0?"+":"")+p.td,"TD share minus yardage share. Large positive means TD-dependent and exposed to regression.")}
      ${sc("ed","ADP edge",p.ed===null?null:(p.ed>0?"+":"")+p.ed,"Picks between UDK TrueValue and market ADP. Positive is a market discount.")}
      ${sc("vol","Volatility",p.vol,"Standard deviation of the last five played finishes.")}
      ${sc("_","Sample",p.gp===null?null:p.gp+"g","Games behind the consistency rates")}
      ${sc("_","Bye",p.bye,"Bye week")}</div>
    ${p.tags.length ? `<p class="rowlbl">UDK labels</p><div class="labs">${p.tags.map(t=>`<span class="fl ${LBLCLS[t]||"m"}" data-tip="On UDK's ${LBL[t]} expert list">${LBL[t]}</span>`).join("")}</div>` : ""}
    ${p.inj ? `<div class="injp"><b>${esc(p.inj)}</b> — ${esc(p.injt||"")}</div>` : ""}
    <div class="cases">${notes.length ? notes.map(cs).join("") : `<p class="none">No notes for this player.</p>`}</div>
  </div>`;
}

const OPTS = {
  pos:  [["ALL","All"],["FLEX","FLEX"],["QB","QB"],["RB","RB"],["WR","WR"],["TE","TE"]],
  sort: [["rank","Rank"],["udk","UDK"],["espn","ESPN"],["adp","ADP"],["claude","Claude"],
         ["tier","Tier"],["start","Start %"],["upside","Upside"],["risk","Risk"],
         ["disagree","Disagreement"]],
  tag:  [["ALL","Verdict"],["strong value","Strong value"],["undervalued","Undervalued"],
         ["consensus","Consensus"],["overvalued","Overvalued"],["strong fade","Strong fade"]],
  label:[["ALL","Label"],["my_guy","My Guy"],["value","Value"],["sleeper","Sleeper"],
         ["breakout","Breakout"],["bust","Bust"],["injury_concern","Injury"]],
};
const sel = (k,v,i) => `<select data-k="${k}" data-i="${i}" aria-label="${k}">` +
  OPTS[k].map(([val,lab]) => `<option value="${val}"${val===v?" selected":""}>${lab}</option>`).join("") + `</select>`;

function renderAddBar(){
  const full = Q.length >= 4;
  const btn = (pos,lab) => `<button class="add" data-add="${pos}"${full?" disabled":""}
    data-tip="${full?"Four panes is the maximum":"Open another pane filtered to "+lab}">+ ${lab}</button>`;
  document.getElementById("addbar").innerHTML =
    btn("ALL","All") + btn("QB","QB") + btn("RB","RB") + btn("WR","WR") + btn("TE","TE") + btn("FLEX","FLEX")
    + `<span class="oth" style="margin-left:6px">${Q.length} of 4 panes</span>`;
}

function render(){
  const quads = document.getElementById("quads");
  quads.dataset.n = Q.length;
  quads.style.setProperty("--n", Q.length);
  renderAddBar();
  quads.innerHTML = Q.map((s,i) => {
    const open = s.open ? P.find(p => p.id === s.open) : null;
    const count = filtered(s).length;
    return `<section class="quad">
      <div class="qbar">${sel("pos",s.pos,i)}${sel("sort",s.sort,i)}${sel("tag",s.tag,i)}${sel("label",s.label,i)}
        <input data-i="${i}" placeholder="search" value="${esc(s.q)}" aria-label="Search pane ${i+1}">
        <span class="oth">${count}</span>
        ${Q.length>1?`<button class="add close" data-del="${i}" data-tip="Close this pane">&times;</button>`:""}</div>
      <div class="body">${open ? profileHtml(open) : listHtml(s)}</div></section>`;
  }).join("");
}

document.getElementById("addbar").addEventListener("click", e => {
  const b = e.target.closest("[data-add]");
  if (b && !b.disabled && Q.length < 4){ Q.push(pane(b.dataset.add)); save(); render(); }
});
document.getElementById("quads").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del){ Q.splice(+del.dataset.del, 1); save(); render(); return; }
  const back = e.target.closest("[data-back]");
  if (back){ const i = [...document.querySelectorAll(".quad")].indexOf(back.closest(".quad")); Q[i].open = null; save(); render(); return; }
  const row = e.target.closest(".r");
  if (row){ const i = [...document.querySelectorAll(".quad")].indexOf(row.closest(".quad")); Q[i].open = row.dataset.id; save(); render(); return; }
  // clicking the pane's own background, outside the profile card, also closes it
  const bodyEl = e.target.closest(".body");
  if (bodyEl && !e.target.closest(".pf")){
    const i = [...document.querySelectorAll(".quad")].indexOf(bodyEl.closest(".quad"));
    if (i > -1 && Q[i].open){ Q[i].open = null; save(); render(); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && Q.some(s => s.open)){ Q.forEach(s => s.open = null); save(); render(); }
});
document.getElementById("quads").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("r")){ e.preventDefault(); e.target.click(); }
});
document.getElementById("quads").addEventListener("change", e => {
  const s = e.target.closest("select"); if (!s) return;
  Q[+s.dataset.i][s.dataset.k] = s.value; Q[+s.dataset.i].open = null; save(); render();
});
document.getElementById("quads").addEventListener("input", e => {
  const inp = e.target.closest("input"); if (!inp) return;
  const i = +inp.dataset.i, pos = inp.selectionStart;
  Q[i].q = inp.value; Q[i].open = null; save(); render();
  const again = document.querySelectorAll(".quad")[i].querySelector("input");
  again.focus(); again.setSelectionRange(pos, pos);
});

const tip = document.createElement("div");
tip.id = "tip"; document.body.appendChild(tip);
let tipFor = null;
function showTip(el){
  const t = el.getAttribute("data-tip"); if (!t) return;
  tipFor = el; tip.textContent = t; tip.classList.add("on");
  const r = el.getBoundingClientRect(); const tb = tip.getBoundingClientRect();
  let x = r.left + r.width/2 - tb.width/2;
  let y = r.top - tb.height - 7;
  if (y < 4) y = r.bottom + 7;
  tip.style.left = Math.max(4, Math.min(x, innerWidth - tb.width - 4)) + "px";
  tip.style.top = Math.max(4, Math.min(y, innerHeight - tb.height - 4)) + "px";
}
function hideTip(){ tip.classList.remove("on"); tipFor = null; }
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if (el !== tipFor){ el ? showTip(el) : hideTip(); }
});
document.addEventListener("mouseleave", () => hideTip(), true);
document.addEventListener("scroll", () => hideTip(), true);
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusout", hideTip);

document.getElementById("tierkey").innerHTML =
  `<span>T1</span>` + Array.from({length:11},(_,i)=>`<i data-tip="Tier ${i+1}" style="background:var(--t${i+1})"></i>`).join("") + `<span>T11</span>`;
render();
</script>
